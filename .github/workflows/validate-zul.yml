name: Validate ZUL corpus

# Regression net for finding F1: every push/PR re-runs the skill's own
# validator over test/valid, test/wrong, the bundled assets, and the showcase
# gallery, and fails on any drift from the committed baseline
# (see test/run-regression.py and test/known-failures.txt).

#
# SKILL.md and marketplace.json are in the filter for the version check below, not
# for the ZUL corpus: a release bump touches only those two, and without them here
# the one job that would catch version drift never runs on the commit that causes it.

on:
  push:
    paths:
      - "test/**"
      - "skills/zul-writer/assets/**"
      - "skills/zul-writer/scripts/**"
      - "skills/zul-writer/SKILL.md"
      - "marketplace.json"
      - "zulwriter-showcase/src/main/webapp/**.zul"
      - ".github/workflows/validate-zul.yml"
  pull_request:
    paths:
      - "test/**"
      - "skills/zul-writer/assets/**"
      - "skills/zul-writer/scripts/**"
      - "skills/zul-writer/SKILL.md"
      - "marketplace.json"
      - "zulwriter-showcase/src/main/webapp/**.zul"
      - ".github/workflows/validate-zul.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: "1"  # never emit usage telemetry from CI runs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # First, and before any dependency is installed: it needs nothing but the
      # standard library, and a version mismatch is worth reporting in seconds
      # rather than after a full corpus run.
      - name: Check version consistency
        run: python3 test/run-version-consistency.py

      - name: Install lxml
        run: python -m pip install --upgrade lxml

      - name: Run ZUL regression net
        run: python3 test/run-regression.py

      # `skills/zul-writer/scripts/**` is inside this workflow's path filter, so
      # preview-zul.py changes already trigger this job -- but run-regression.py only
      # exercises validate-zul.py, so without this the job would go green having tested
      # nothing about the preview script.
      #
      # Deliberately NOT a real render: that needs a JDK, ZK jars from
      # mavensync.zkoss.org, a launcher download from GitHub Releases and a headless
      # browser -- minutes of runtime and several flaky network dependencies. What
      # actually breaks in practice is the *skip* path (an import error, a crash where a
      # clean exit 2 was expected, a bad argparse spec), so test exactly that: no
      # playwright, no JDK, no network, ~2 seconds.
      #
      # An unusable --classpath is the right trigger rather than "a project with no ZK":
      # this runner HAS Maven, so the no-project path would legitimately fall back to
      # fetching stock ZK and succeed. It also pins the ordering that matters -- reject
      # an unusable classpath BEFORE downloading a jar or starting a JVM.
      - name: Smoke-test preview-zul.py
        run: |
          python3 skills/zul-writer/scripts/preview-zul.py --help > /dev/null
          mkdir -p /tmp/nozk
          printf '<zk><label value="hi"/></zk>\n' > /tmp/nozk/smoke.zul
          set +e
          out=$(python3 skills/zul-writer/scripts/preview-zul.py \
                  --classpath /nonexistent/none.jar \
                  --out /tmp/nozk/out.png /tmp/nozk/smoke.zul 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" != "2" ]; then
            echo "::error::expected exit 2 for an unusable classpath, got $code"; exit 1
          fi
          if ! echo "$out" | grep -q '^PREVIEW_SKIPPED:'; then
            echo "::error::exit 2 without a PREVIEW_SKIPPED: reason"; exit 1
          fi
          if [ -e /tmp/nozk/out.png ]; then
            echo "::error::wrote a PNG on the skip path"; exit 1
          fi
          # A crash now also exits 2 (it must not exit 1 -- that means "your ZUL is
          # broken"), so the exit code alone no longer distinguishes one from a clean
          # skip. The wording does.
          if echo "$out" | grep -q 'internal error'; then
            echo "::error::the script crashed instead of skipping cleanly"; exit 1
          fi
          # --debug must add nothing to stdout: the caller parses stdout, so turning
          # diagnostics on must not change what it sees.
          dbg=$(python3 skills/zul-writer/scripts/preview-zul.py --debug \
                  --classpath /nonexistent/none.jar \
                  --out /tmp/nozk/out.png /tmp/nozk/smoke.zul 2>/dev/null || true)
          plain=$(python3 skills/zul-writer/scripts/preview-zul.py \
                  --classpath /nonexistent/none.jar \
                  --out /tmp/nozk/out.png /tmp/nozk/smoke.zul 2>/dev/null || true)
          if [ "$dbg" != "$plain" ]; then
            echo "::error::--debug changed stdout"; exit 1
          fi
          # The JSON sidecar (P2-5) must also be written -- and be valid JSON -- on the
          # skip path, which is the one path a caller cannot learn anything else from.
          # Removed first so the assertion cannot pass on a leftover file: a stale but
          # parseable /tmp/r.json would hide exactly the regression this checks for.
          rm -f /tmp/r.json
          set +e
          python3 skills/zul-writer/scripts/preview-zul.py \
            --classpath /nonexistent/none.jar --report json:/tmp/r.json \
            --out /tmp/nozk/out.png /tmp/nozk/smoke.zul > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" != "2" ]; then
            echo "::error::--report json changed the skip exit code: got $code, expected 2"; exit 1
          fi
          if ! python3 -c 'import json,sys; json.load(open("/tmp/r.json"))'; then
            echo "::error::--report json did not write parseable JSON on the skip path"; exit 1
          fi
